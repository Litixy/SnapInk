:root{
  --bg:#e9efff;--bg2:#f7f4ff;--glass:rgba(255,255,255,.66);--glass-strong:rgba(255,255,255,.84);--glass-soft:rgba(255,255,255,.42);

*{box-sizing:border-box}

.brush-cursor.eraser-cursor{border:2px solid #7f8ba4;border-radius:8px;transform:translate(-50%,-50%) rotate(-18deg);background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(127,139,164,.12));box-shadow:0 0 0 2px rgba(255,255,255,.35),0 4px 12px rgba(75,88,120,.18)}

t-size:12px}.size-actions button.primary{background:linear-gradient(135deg,#7386ff,#8c76f7);border-color:rgba(255,255,255,.64);color:white}.size-note{display:block;margin-top:9px;color:#9aa9bb;font-size:10px;line-height:1.4}.advanced-size{margin-top:12px;color:#8194ad;font-size:10px}.shape-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.shape-choice{min-height:52px;padding:5px 2px;border-radius:11px;color:#8396b0;cursor:pointer}.shape-choice:hover,.shape-choice.selected{border-color:rgba(114,133,255,.55);background:rgba(119,141,255,.1);color:#5872ef}.shape-glyph{display:block;height:27px;font-size:22px;line-height:25px;text-align:center;color:currentColor}.shape-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:9px;text-align:center}.shape-options{display:flex;align-items:center;gap:8px;margin-top:10px;color:#7d91ac;font-size:11px}.shape-edit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.shape-edit-grid[hidden]{display:none}.shape-edit-grid label{font-size:10px;color:#7d91ac}.shape-edit-grid input{width:100%;margin-top:5px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--input-bg);padding:0 8px;outline:none}.selection-handle{position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;border:2px solid #7180ff;box-shadow:0 2px 6px rgba(65,80,150,.18)}.save-panel{position:fixed;z-index:120;top:92px;right:34px;width:360px;max-width:calc(100vw - 24px);padding:16px;background:rgba(249,252,255,.88);backdrop-filter:blur(26px) saturate(155%);-webkit-backdrop-filter:blur(26px) saturate(155%);border:1px solid rgba(255,255,255,.92);border-radius:20px;box-shadow:0 26px 70px rgba(47,60,100,.2),inset 0 1px 0 rgba(255,255,255,.86);color:#56708f}.save-panel[hidden]{display:none}.save-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.save-panel-head strong{display:block; <script>
(function(){
  "use strict";

  /* =========================================================
     初期設定
  ========================================================= */
  let CANVAS_W = 1100;
  let CANVAS_H = 720;
  const UNDO_LIMIT = 20;

  const TOOL_NAMES = { pen:"ペン", eraser:"消しゴム", eyedropper:"スポイト", fill:"塗りつぶし", shape:"図形", select:"ポインター" };
  const LAYER_NAMES = { line:"線画", base:"下塗り" };

  const state = {
    tool: "pen",
    shapeType: "rectangle",
    shapeFill: false,
    shapeOutline: true,
    color: "#1a1a1a",
    lineWidth: 4,
    brushStyle: "marker",
    colorHsl: {h:0,s:0,l:10},
    textStyle: { fontFamily:"-apple-system,BlinkMacSystemFont,\"SF Pro Text\",\"Hiragino Kaku Gothic ProN\",\"Yu Gothic\",Meiryo,sans-serif", fontSize:40, fontWeight:400, italic:false, underline:false, align:"left" },
    activeLayer: "line",
    layers: {
      base:{ visible:true },
      line:{ visible:true }
    },
    smoothing:{
      enabled:true,
      strength:40

    drawing:false,

    shapeStart:null,

  /* =========================================================

  const ctxShapes = canvasShapes.getContext("2d");

  const brushCursorEl = document.getElementById("brushCursor");

  const colorInput = document.getElementById("colorInput");
  const brushStyleGroup = document.getElementById("brushStyleGroup");
  const brushStyleInput = document.getElementById("brushStyleInput");
  const saturationInput = document.getElementById("saturationInput");

  const lightnessValue = document.getElementById("lightnessValue");

  const shapeWidthInput = document.getElementById("shapeWidthInput");
  const shapeHeightInput = document.getElementById("shapeHeightInput");
  const shapeRotationInput = document.getElementById("shapeRotationInput");

  const themeToggle = document.getElementById("themeToggle");

  const widthPreview = document.getElementById("widthPreview");

  const sizeBtn = document.getElementById("sizeBtn");
  const sizePanel = document.getElementById("sizePanel");

  const canvasHeightInput = document.getElementById("canvasHeightInput");
  const sizeCancelBtn = document.getElementById("sizeCancelBtn");
  const sizeApplyBtn = document.getElementById("sizeApplyBtn");

  /* 統合Undo/Redo履歴（複数レイヤーにまたがる操作にも対応） */
  let undoStack = [];
  let redoStack = [];

  /* =========================================================
     初期化
  ========================================================= */
  function init(){
    [canvasBase, canvasLine, canvasShapes, interaction].forEach(function(c){
      c.width = CANVAS_W;
      c.height = CANVAS_H;
    });
    selectTool("pen");
    setColor(state.color);
    highlightActiveSwatch();
    updateUndoRedoButtons();
    updateSelectionButtons();
  }

  /* =========================================================
     座標変換
  ========================================================= */
  function getPos(evt){
    const rect = interaction.getBoundingClientRect();
    const scaleX = interaction.width / rect.width;
    const scaleY = interaction.height / rect.height;
    return {
      x:(evt.clientX - rect.left) * scaleX,
      y:(evt.clientY - rect.top) * scaleY
    };
  }

  function clamp(v, min, max){ return Math.min(max, Math.max(min, v)); }

  /* =========================================================
     ステータスバー
  ========================================================= */
  function updateStatusBar(){
    const parts = [];
    parts.push("ツール: " + (TOOL_NAMES[state.tool] || state.tool));
    parts.push("レイヤー: " + (LAYER_NAMES[state.activeLayer] || state.activeLayer));
    if (state.selectionRect && state.selectionRect.w > 0 && state.selectionRect.h > 0){
      parts.push("選択範囲: " + Math.round(state.selectionRect.w) + "×" + Math.round(state.selectionRect.h) + "px");
    }
    parts.push(CANVAS_W + "×" + CANVAS_H + "px");
    statusBarEl.textContent = parts.join("  ・  ");
  }

  /* =========================================================
     描画スタイル適用
  ========================================================= */
  function applyStrokeStyle(ctx){
    ctx.lineCap = state.brushStyle === "marker" ? "round" : "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = state.lineWidth * (state.brushStyle === "marker" ? 1.18 : 1);
    if (state.tool === "eraser"){
      ctx.globalCompositeOperation = "destination-out";
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "rgba(0,0,0,1)";
      ctx.fillStyle = "rgba(0,0,0,1)";
    } else {
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = state.brushStyle === "marker" ? 0.38 : 1;
      ctx.strokeStyle = state.color;
      ctx.fillStyle = state.color;
    }
  }

  function previewStyle(ctx){
    ctx.lineCap = state.brushStyle === "marker" ? "round" : "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = state.lineWidth * (state.brushStyle === "marker" ? 1.18 : 1);
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = state.tool === "eraser" ? 0.55 : (state.brushStyle === "marker" ? 0.38 : 1);
    ctx.strokeStyle = (state.tool === "eraser") ? "rgba(120,130,150,1)" : state.color;
  }

  /* =========================================================
     Undo / Redo（統合履歴）
  ========================================================= */
  function cloneShapeObjects(){
    return state.shapeObjects.map(function(item){
      return {rect:{x:item.rect.x,y:item.rect.y,w:item.rect.w,h:item.rect.h},type:item.type,fill:item.fill,outline:item.outline,layer:item.layer,style:Object.assign({},item.style||{}),rotation:item.rotation||0};
    });
  }
  function snapshotLayers(layerKeys){
    const snap = {};
    layerKeys.forEach(function(key){
      const ctx = key === "base" ? ctxBase : (key === "shapes" ? ctxShapes : ctxLine);
      snap[key] = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    });
    if (layerKeys.indexOf("shapes") !== -1) snap.shapeObjects = cloneShapeObjects();
    return snap;
  }

  function pushUndo(layerKeys){
    undoStack.push(snapshotLayers(layerKeys));
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    redoStack = [];
    updateUndoRedoButtons();
  }

  function undo(){
    if (!undoStack.length) return;
    const snap = undoStack.pop();
    const keys = Object.keys(snap).filter(function(key){ return key !== "shapeObjects"; });
    redoStack.push(snapshotLayers(keys));
    keys.forEach(function(key){
      const ctx = key === "base" ? ctxBase : (key === "shapes" ? ctxShapes : ctxLine);
      ctx.putImageData(snap[key], 0, 0);
    });
    if (snap.shapeObjects) { state.shapeObjects = snap.shapeObjects; redrawShapeLayer(); }
    updateUndoRedoButtons();
  }

  function redo(){
    if (!redoStack.length) return;
    const snap = redoStack.pop();
    const keys = Object.keys(snap).filter(function(key){ return key !== "shapeObjects"; });
    undoStack.push(snapshotLayers(keys));
    keys.forEach(function(key){
      const ctx = key === "base" ? ctxBase : (key === "shapes" ? ctxShapes : ctxLine);
      ctx.putImageData(snap[key], 0, 0);
    });
    if (snap.shapeObjects) { state.shapeObjects = snap.shapeObjects; redrawShapeLayer(); }
    updateUndoRedoButtons();
  }

  function updateUndoRedoButtons(){
    const canUndo = undoStack.length > 0, canRedo = redoStack.length > 0;
    undoBtn.disabled = !canUndo;
    redoBtn.disabled = !canRedo;
    if(mobileUndo) mobileUndo.disabled = !canUndo;
    if(mobileRedo) mobileRedo.disabled = !canRedo;
    if(mobileDelete) mobileDelete.disabled = !(state.selectedShape || (state.selectionRect && state.selectionRect.w > 0 && state.selectionRect.h > 0));
  }

  /* =========================================================
     ライブプレビュー（描画中）
  ========================================================= */
  function drawLivePreview(){
    ctxInteraction.clearRect(0, 0, CANVAS_W, CANVAS_H);
    const pts = state.currentStroke;
    if (pts.length < 2) return;
    previewStyle(ctxInteraction);
    ctxInteraction.beginPath();
    ctxInteraction.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++){
      const mx = (pts[i].x + pts[i + 1].x) / 2;
      const my = (pts[i].y + pts[i + 1].y) / 2;
      ctxInteraction.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    ctxInteraction.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
    ctxInteraction.stroke();
  }

  /* =========================================================
     線画補正（コア機能）
     Ramer-Douglas-Peucker で間引き → Catmull-Rom を
     3次ベジエ曲線に変換して滑らかな輪郭線を描く
  ========================================================= */
  function strengthToTolerance(strength){
    return 0.5 + (strength / 100) * 5.5;
  }

  function sqSegDist(p, p1, p2){
    let x = p1.x, y = p1.y, dx = p2.x - x, dy = p2.y - y;
    if (dx !== 0 || dy !== 0){
      const t = ((p.x - x) * dx + (p.y - y) * dy) / (dx * dx + dy * dy);
      if (t > 1){ x = p2.x; y = p2.y; }
      else if (t > 0){ x += dx * t; y += dy * t; }
    }
    dx = p.x - x; dy = p.y - y;
    return dx * dx + dy * dy;
  }

  function rdpStep(points, first, last, sqTolerance, out){
    let maxDist = sqTolerance, index = -1;
    for (let i = first + 1; i < last; i++){
      const d = sqSegDist(points[i], points[first], points[last]);
      if (d > maxDist){ index = i; maxDist = d; }
    }
    if (index > -1){
      if (index - first > 1) rdpStep(points, first, index, sqTolerance, out);
      out.push(points[index]);
      if (last - index > 1) rdpStep(points, index, last, sqTolerance, out);
    }
  }

  function simplifyPoints(points, tolerance){
    if (points.length <= 2) return points.slice();
    const sqTolerance = tolerance * tolerance;
    const out = [points[0]];
    rdpStep(points, 0, points.length - 1, sqTolerance, out);
    out.push(points[points.length - 1]);
    return out;
  }

  function catmullRomSegments(pts){
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++){
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      segs.push({
        c1x:p1.x + (p2.x - p0.x) / 6,
        c1y:p1.y + (p2.y - p0.y) / 6,
        c2x:p2.x - (p3.x - p1.x) / 6,
        c2y:p2.y - (p3.y - p1.y) / 6,
        x:p2.x,
        y:p2.y
      });
    }
    return segs;
  }

  function updateSmoothStatus(beforeCount, afterCount, smoothed){
    if (smoothed){
      smoothStatus.textContent = "直前のストローク: " + beforeCount + "点 → " + afterCount + "点に補正（AIスムージングON）";
    } else if (state.smoothing.enabled){
      smoothStatus.textContent = "直前のストローク: " + beforeCount + "点（点数が少なく補正なし）";
    } else {
      smoothStatus.textContent = "直前のストローク: " + beforeCount + "点（補正OFF）";
    }
  }

  /* =========================================================
     ストローク確定処理（ペン／消しゴム）
  ========================================================= */
  function activeCtx(){
    return state.activeLayer === "base" ? ctxBase : ctxLine;
  }

  function commitDot(p){
    const ctx = activeCtx();
    applyStrokeStyle(ctx);
    ctx.beginPath();
    ctx.arc(p.x, p.y, Math.max(state.lineWidth / 2, 0.6), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    updateSmoothStatus(1, 1, false);
  }

  function commitStroke(rawPoints){
    const ctx = activeCtx();
    applyStrokeStyle(ctx);

    let pathPoints = rawPoints;
    let smoothed = false;

    if (state.smoothing.enabled && rawPoints.length >= 3){
      const tolerance = strengthToTolerance(state.smoothing.strength);
      pathPoints = simplifyPoints(rawPoints, tolerance);
      smoothed = pathPoints.length >= 3;
    }

    ctx.beginPath();
    ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
    if (pathPoints.length === 2){
      ctx.lineTo(pathPoints[1].x, pathPoints[1].y);
    } else if (smoothed){
      const segs = catmullRomSegments(pathPoints);
      for (let i = 0; i < segs.length; i++){
        const s = segs[i];
        ctx.bezierCurveTo(s.c1x, s.c1y, s.c2x, s.c2y, s.x, s.y);
      }
    } else {
      for (let i = 1; i < pathPoints.length; i++){
        ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
      }
    }
    ctx.stroke();
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;

    updateSmoothStatus(rawPoints.length, pathPoints.length, smoothed);
  }

  /* =========================================================
     スポイトツール
  ========================================================= */
  function rgbToHex(r, g, b){
    return "#" + [r, g, b].map(function(v){
      return v.toString(16).padStart(2, "0");
    }).join("");
  }

  function pickColorAt(x, y){
    const merge = document.createElement("canvas");
    merge.width = CANVAS_W; merge.height = CANVAS_H;
    const mctx = merge.getContext("2d");
    mctx.fillStyle = "#e7e9ee";
    mctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    if (state.layers.base.visible) mctx.drawImage(canvasBase, 0, 0);
    if (state.layers.line.visible) mctx.drawImage(canvasLine, 0, 0);
    mctx.drawImage(canvasShapes, 0, 0);
    const px = clamp(Math.round(x), 0, CANVAS_W - 1);
    const py = clamp(Math.round(y), 0, CANVAS_H - 1);
    const data = mctx.getImageData(px, py, 1, 1).data;
    setColor(rgbToHex(data[0], data[1], data[2]));
  }

  /* =========================================================
     塗りつぶしツール（バケツ）
  ========================================================= */
  function hexToRgb(hex){
    const v = hex.replace("#", "");
    return {
      r:parseInt(v.substring(0, 2), 16),
      g:parseInt(v.substring(2, 4), 16),
      b:parseInt(v.substring(4, 6), 16)
    };
  }

  function colorsMatch(r1,g1,b1,a1, r2,g2,b2,a2, tol){
    return Math.abs(r1 - r2) <= tol && Math.abs(g1 - g2) <= tol &&
           Math.abs(b1 - b2) <= tol && Math.abs(a1 - a2) <= tol;
  }

  function floodFill(ctx, startX, startY, fillColorHex){
    if (startX < 0 || startX >= CANVAS_W || startY < 0 || startY >= CANVAS_H) return;
    const imgData = ctx.getImageData(0, 0, CANVAS_W, CANVAS_H);
    const data = imgData.data;
    const w = CANVAS_W, h = CANVAS_H;
    const startIdx = (startY * w + startX) * 4;
    const startR = data[startIdx], startG = data[startIdx + 1], startB = data[startIdx + 2], startA = data[startIdx + 3];

    const fill = hexToRgb(fillColorHex);
    const tolerance = 48;

    if (colorsMatch(startR, startG, startB, startA, fill.r, fill.g, fill.b, 255, 4)) return;

    const stack = [[startX, startY]];
    const visited = new Uint8Array(w * h);

    while (stack.length){
      const p = stack.pop();
      const x = p[0], y = p[1];
      if (x < 0 || x >= w || y < 0 || y >= h) continue;
      const vIdx = y * w + x;
      if (visited[vIdx]) continue;
      const idx = vIdx * 4;
      if (!colorsMatch(data[idx], data[idx+1], data[idx+2], data[idx+3], startR, startG, startB, startA, tolerance)) continue;
      visited[vIdx] = 1;
      data[idx] = fill.r; data[idx+1] = fill.g; data[idx+2] = fill.b; data[idx+3] = 255;
      stack.push([x+1,y],[x-1,y],[x,y+1],[x,y-1]);
    }
    ctx.putImageData(imgData, 0, 0);
  }

  /* =========================================================
     テキストツール
  ========================================================= */
  function getTextFontSize(){ return clamp(Number(state.textStyle.fontSize) || 40, 8, 300); }

  function getTextFontCss(){
    const weight = state.textStyle.fontWeight >= 700 ? "700" : "400";
    const italic = state.textStyle.italic ? "italic " : "normal ";
    return italic + weight + " " + getTextFontSize() + "px " + state.textStyle.fontFamily;
  }

  function placeTextAt(p){
    const old = document.getElementById("inlineTextEditor");
    if (old) old.remove();
    const interactionRect = interaction.getBoundingClientRect();
    const z = interaction.width ? interactionRect.width / interaction.width : 1;
    const wrap = document.createElement("div");
    wrap.id = "inlineTextEditor";
    wrap.className = "inline-text-editor";
    wrap.style.left = (p.x * z) + "px";
    wrap.style.top = (p.y * z) + "px";
    const input = document.createElement("textarea");
    input.rows = 2;
    input.placeholder = "文字を入力…";
    input.autocomplete = "off";
    input.value = "";
    input.style.fontFamily = state.textStyle.fontFamily;
    input.style.fontSize = Math.max(16, Math.round(getTextFontSize()*z)) + "px";
    input.style.fontWeight = String(state.textStyle.fontWeight);
    input.style.fontStyle = state.textStyle.italic ? "italic" : "normal";
    const actions = document.createElement("div");
    actions.className = "text-editor-actions";
    const cancel = document.createElement("button"); cancel.type="button"; cancel.textContent="取消";
    const commitBtn = document.createElement("button"); commitBtn.type="button"; commitBtn.className="commit"; commitBtn.textContent="配置";
    actions.append(cancel, commitBtn);
    wrap.append(input, actions);
    stageEl.appendChild(wrap);
    requestAnimationFrame(function(){ input.focus(); });

    let closed = false;
    const removeEditor = function(){ if(closed) return; closed=true; wrap.remove(); };
    const commit = function(){
      if(closed) return;
      const raw = input.value.replace(/\r/g, "");
      if(!raw.trim()){ removeEditor(); return; }
      removeEditor();
      const layer = state.activeLayer;
      pushUndo([layer]);
      const ctx = layer === "base" ? ctxBase : ctxLine;
      ctx.save();
      ctx.globalCompositeOperation="source-over"; ctx.globalAlpha=1;
      ctx.fillStyle=state.color; ctx.font=getTextFontCss(); ctx.textBaseline="top"; ctx.textAlign=state.textStyle.align;
      const lines = raw.split("\n");
      const lineHeight = getTextFontSize()*1.28;
      const x = p.x;
      for(let i=0;i<lines.length;i++) ctx.fillText(lines[i],x,p.y+i*lineHeight);
      if(state.textStyle.underline){
        const maxWidth = Math.max.apply(null, lines.map(function(line){ return ctx.measureText(line).width; }));
        let ux=x;
        if(state.textStyle.align === "center") ux=x-maxWidth/2; else if(state.textStyle.align === "right") ux=x-maxWidth;
        ctx.strokeStyle=state.color; ctx.lineWidth=Math.max(1,getTextFontSize()/18); ctx.beginPath(); ctx.moveTo(ux,p.y+getTextFontSize()*1.06); ctx.lineTo(ux+maxWidth,p.y+getTextFontSize()*1.06); ctx.stroke();
      }
      ctx.restore();
    };
    commitBtn.addEventListener("click", commit);
    cancel.addEventListener("click", removeEditor);
    input.addEventListener("keydown",function(e){
      if(e.key === "Escape"){ e.preventDefault(); removeEditor(); return; }
      if(e.key === "Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); commit(); }
    });
  }

  /* =========================================================
     範囲選択
  ========================================================= */
  function normalizeRect(a, b){
    const x1 = clamp(Math.min(a.x, b.x), 0, CANVAS_W);
    const y1 = clamp(Math.min(a.y, b.y), 0, CANVAS_H);
    const x2 = clamp(Math.max(a.x, b.x), 0, CANVAS_W);
    const y2 = clamp(Math.max(a.y, b.y), 0, CANVAS_H);
    return { x:x1, y:y1, w:x2 - x1, h:y2 - y1 };
  }

  const SHAPES = [
    ["rectangle","長方形","▭"],["rounded","角丸","▢"],["ellipse","楕円","⬭"],["circle","円","○"],["triangle","三角形","△"],
    ["rightTriangle","直角三角","◢"],["diamond","ひし形","◇"],["parallelogram","平行四辺形","▱"],["trapezoid","台形","⏢"],["pentagon","五角形","⬠"],
    ["hexagon","六角形","⬡"],["octagon","八角形","🛑"],["star5","五芒星","☆"],["star6","六芒星","✶"],["burst","爆発","☀"],
    ["heart","ハート","♡"],["cloud","雲","☁"],["speech","吹き出し","▱"],["arrowRight","右矢印","➜"],["arrowLeft","左矢印","←"],
    ["arrowUp","上矢印","↑"],["arrowDown","下矢印","↓"],["chevron","シェブロン","⌄"],["cross","十字","✚"],["plus","プラス","＋"],
    ["ring","リング","◎"],["cylinder","円柱","▤"],["cone","円すい","◢"],["lightning","稲妻","ϟ"],["gear","歯車","⚙"]
  ];

  function renderShapePalette(){
    shapeGrid.innerHTML = SHAPES.map(function(shape){
      return '<button type="button" class="shape-choice" data-shape="'+shape[0]+'" title="'+shape[1]+'"><span class="shape-glyph">'+shape[2]+'</span><span class="shape-label">'+shape[1]+'</span></button>';
    }).join('');
    shapeGrid.querySelectorAll('.shape-choice').forEach(function(button){
      button.addEventListener('click', function(){
        state.shapeType = button.dataset.shape;
        shapeGrid.querySelectorAll('.shape-choice').forEach(function(item){ item.classList.toggle('selected', item === button); });
      });
    });
    const first = shapeGrid.querySelector('.shape-choice');
    if (first) first.classList.add('selected');
  }

  function roundedPath(ctx, x, y, w, h, radius){
    const r = Math.min(radius, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
  }

  function polygonPath(ctx, cx, cy, rx, ry, sides, rotation){
    ctx.beginPath();
    for (let i=0; i<sides; i++){
      const a = rotation + i * Math.PI * 2 / sides;
      const x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
      if (i === 0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  function starPath(ctx, cx, cy, rx, ry, points){
    ctx.beginPath();
    for (let i=0; i<points*2; i++){
      const a = -Math.PI/2 + i * Math.PI / points;
      const scale = i % 2 === 0 ? 1 : .42;
      const x = cx + Math.cos(a) * rx * scale, y = cy + Math.sin(a) * ry * scale;
      if (!i) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.closePath();
  }

  function drawShapePath(ctx, type, rect){
    const x=rect.x, y=rect.y, w=rect.w, h=rect.h, cx=x+w/2, cy=y+h/2;
    if (type === 'rectangle'){ ctx.beginPath(); ctx.rect(x,y,w,h); }
    else if (type === 'rounded'){ roundedPath(ctx,x,y,w,h,Math.min(w,h)*.16); }
    else if (type === 'ellipse'){ ctx.beginPath(); ctx.ellipse(cx,cy,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2); }
    else if (type === 'circle'){ const r=Math.min(Math.abs(w),Math.abs(h))/2; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); }
    else if (type === 'triangle'){ ctx.beginPath(); ctx.moveTo(cx,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); }
    else if (type === 'rightTriangle'){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y+h); ctx.lineTo(x,y+h); ctx.closePath(); }
    else if (type === 'diamond'){ polygonPath(ctx,cx,cy,w/2,h/2,4,Math.PI/4); }
    else if (type === 'parallelogram'){ ctx.beginPath(); const s=w*.2; ctx.moveTo(x+s,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w-s,y+h);ctx.lineTo(x,y+h);ctx.closePath(); }
    else if (type === 'trapezoid'){ ctx.beginPath();ctx.moveTo(x+w*.2,y);ctx.lineTo(x+w*.8,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath(); }
    else if (type === 'pentagon'){ polygonPath(ctx,cx,cy,w/2,h/2,5,-Math.PI/2); }
    else if (type === 'hexagon'){ polygonPath(ctx,cx,cy,w/2,h/2,6,Math.PI/6); }
    else if (type === 'octagon'){ polygonPath(ctx,cx,cy,w/2,h/2,8,Math.PI/8); }
    else if (type === 'star5'){ starPath(ctx,cx,cy,w/2,h/2,5); }
    else if (type === 'star6'){ starPath(ctx,cx,cy,w/2,h/2,6); }
    else if (type === 'burst'){ starPath(ctx,cx,cy,w/2,h/2,12); }
    else if (type === 'heart'){ ctx.beginPath();ctx.moveTo(cx,y+h*.9);ctx.bezierCurveTo(x-w*.05,y+h*.55,x+w*.12,y+h*.08,cx,y+h*.3);ctx.bezierCurveTo(x+w*.88,y+h*.08,x+w*1.05,y+h*.55,cx,y+h*.9);ctx.closePath(); }
    else if (type === 'cloud'){ ctx.beginPath();ctx.arc(x+w*.32,y+h*.57,h*.25,Math.PI,Math.PI*2);ctx.arc(x+w*.55,y+h*.4,h*.32,Math.PI,Math.PI*2);ctx.arc(x+w*.76,y+h*.58,h*.23,Math.PI,Math.PI*2);ctx.lineTo(x+w*.94,y+h*.85);ctx.lineTo(x+w*.1,y+h*.85);ctx.closePath(); }
    else if (type === 'speech'){ roundedPath(ctx,x,y,w,h*.78,Math.min(w,h)*.12);ctx.moveTo(x+w*.28,y+h*.78);ctx.lineTo(x+w*.22,y+h);ctx.lineTo(x+w*.46,y+h*.78); }
    else if (type.indexOf('arrow') === 0){ ctx.beginPath(); const vertical=type==='arrowUp'||type==='arrowDown'; const head=vertical?h*.3:w*.3; if(type==='arrowRight'){ctx.moveTo(x,y+h*.35);ctx.lineTo(x+w-head,y+h*.35);ctx.lineTo(x+w-head,y);ctx.lineTo(x+w,y+h/2);ctx.lineTo(x+w-head,y+h);ctx.lineTo(x+w-head,y+h*.65);ctx.lineTo(x,y+h*.65);} else if(type==='arrowLeft'){ctx.moveTo(x+head,y);ctx.lineTo(x,y+h/2);ctx.lineTo(x+head,y+h);ctx.lineTo(x+head,y+h*.65);ctx.lineTo(x+w,y+h*.65);ctx.lineTo(x+w,y+h*.35);ctx.lineTo(x+head,y+h*.35);} else if(type==='arrowUp'){ctx.moveTo(x+w*.35,y+head);ctx.lineTo(x+w/2,y);ctx.lineTo(x+w*.65,y+head);ctx.lineTo(x+w*.65,y+h);ctx.lineTo(x+w*.35,y+h);} else {ctx.moveTo(x+w*.35,y);ctx.lineTo(x+w*.65,y);ctx.lineTo(x+w*.65,y+h-head);ctx.lineTo(x+w,y+h-head);ctx.lineTo(x+w/2,y+h);ctx.lineTo(x,y+h-head);ctx.lineTo(x+w*.35,y+h-head);} ctx.closePath(); }

  ];

  function renderSizePresets(){
    sizePresetGrid.innerHTML = SIZE_PRESETS.map(function(item, index){
      return '<button type="button" class="size-preset" data-preset-index="'+index+'" title="'+item[0]+' '+item[1]+'×'+item[2]+'px"><span class="preset-shape '+item[3]+'"></span><span class="preset-label">'+item[0]+'</span></button>';
    }).join('');
    sizePresetGrid.querySelectorAll('.size-preset').forEach(function(button){
      button.addEventListener('click', function(){
        const preset = SIZE_PRESETS[Number(button.dataset.presetIndex)];
        resizeCanvas(preset[1], preset[2]);
        selectSizePreset(preset[1], preset[2]);
      });
    });
  }

  function selectSizePreset(width, height){
    sizePresetGrid.querySelectorAll('.size-preset').forEach(function(button){
      const preset = SIZE_PRESETS[Number(button.dataset.presetIndex)];
      button.classList.toggle('selected', preset[1] === width && preset[2] === height);
    });
  }

  function syncSizeInputs(){
    canvasWidthInput.value = String(CANVAS_W);
    canvasHeightInput.value = String(CANVAS_H);
    selectSizePreset(CANVAS_W, CANVAS_H);
  }

  function resizeCanvas(newWidth, newHeight){
    newWidth = clamp(Math.round(newWidth), 64, 4096); newHeight = clamp(Math.round(newHeight), 64, 4096);
    if (newWidth === CANVAS_W && newHeight === CANVAS_H) { requestAnimationFrame(fitCanvasToView); return; }
    pushUndo(["base","line","shapes"]);
    const oldWidth = CANVAS_W, oldHeight = CANVAS_H;
    const snapshots = [canvasBase,canvasLine,canvasShapes].map(function(canvas){ const temp=document.createElement("canvas"); temp.width=oldWidth; temp.height=oldHeight; temp.getContext("2d").drawImage(canvas,0,0); return temp; });
    const sx = newWidth/oldWidth, sy = newHeight/oldHeight;
    CANVAS_W=newWidth; CANVAS_H=newHeight;
    [canvasBase,canvasLine,canvasShapes,interaction].forEach(function(canvas){ canvas.width=CANVAS_W; canvas.height=CANVAS_H; });
    snapshots.forEach(function(temp,index){
      const ctx=index===0?ctxBase:(index===1?ctxLine:ctxShapes); ctx.drawImage(temp,0,0,oldWidth,oldHeight,0,0,CANVAS_W,CANVAS_H);
    });
    state.shapeObjects.forEach(function(item){ item.rect={x:item.rect.x*sx,y:item.rect.y*sy,w:item.rect.w*sx,h:item.rect.h*sy}; if(item.style) item.style.lineWidth*=Math.min(sx,sy); });
    state.selectionRect=null; state.selectedShape=null; savePanel.hidden=true; syncSizeInputs(); updateStatusBar(); selectSizePreset(CANVAS_W,CANVAS_H); updateUndoRedoButtons(); userZoomed=false; requestAnimationFrame(fitCanvasToView);
    fitCanvasToView();
  }

  function closeSizePanel(){
    sizePanel.hidden = true;
    sizeBtn.setAttribute("aria-expanded", "false");
  }

  function applySizeFromInputs(){
    resizeCanvas(Number(canvasWidthInput.value), Number(canvasHeightInput.value));
    closeSizePanel();
  }

  renderSizePresets();
  sizeBtn.addEventListener("click", function(){
    syncSizeInputs();
    sizePanel.hidden = !sizePanel.hidden;
    sizeBtn.setAttribute("aria-expanded", String(!sizePanel.hidden));
    if (!sizePanel.hidden) canvasWidthInput.focus();
  });
  sizeCancelBtn.addEventListener("click", closeSizePanel);
  sizeApplyBtn.addEventListener("click", applySizeFromInputs);
  sizePanel.addEventListener("keydown", function(e){
    if (e.key === "Enter") applySizeFromInputs();
    if (e.key === "Escape") closeSizePanel();
  });

  /* =========================================================
     レイヤー切り替え・表示制御
  ========================================================= */
  document.querySelectorAll(".layer-item").forEach(function(item){
    item.addEventListener("click", function(e){
      if (e.target.closest(".layer-vis-btn")) return;
      document.querySelectorAll(".layer-item").forEach(function(i){ i.classList.remove("active"); });
      item.classList.add("active");
      state.activeLayer = item.dataset.layer;
      updateStatusBar();
    });
  });

  document.querySelectorAll(".layer-vis-btn").forEach(function(btn){
    btn.addEventListener("click", function(e){
      e.stopPropagation();
      const layer = btn.dataset.layer;
      state.layers[layer].visible = !state.layers[layer].visible;
      btn.classList.toggle("hidden-icon", !state.layers[layer].visible);
      canvases[layer].classList.toggle("hidden-layer", !state.layers[layer].visible);
    });
  });

  /* =========================================================
     クリア・元に戻す／やり直し・左右反転・PNG書き出し
  ========================================================= */
  clearBtn.addEventListener("click", function(){
    const layer = state.activeLayer;
    const layerName = LAYER_NAMES[layer] || layer;
    pushUndo([layer]);
    const ctx = layer === "base" ? ctxBase : ctxLine;
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    updateStatusBar();
  });

  clearSelectionBtn.addEventListener("click", eraseSelectionArea);

  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);
  if(mobileUndo) mobileUndo.addEventListener("click", undo);
  if(mobileRedo) mobileRedo.addEventListener("click", redo);
  if(mobileDelete) mobileDelete.addEventListener("click", function(){
    if(state.selectedShape){ deleteSelectedShape(); return; }
    if(state.selectionRect){ eraseSelectionArea(); }
  });

  flipBtn.addEventListener("click", function(){
    pushUndo(["base","line","shapes"]);
    flipCanvasHorizontal(ctxBase); flipCanvasHorizontal(ctxLine); flipCanvasHorizontal(ctxShapes);
    state.shapeObjects.forEach(function(item){ item.rect.x = CANVAS_W - item.rect.x - item.rect.w; });
    if (state.selectionRect) deselect();
  });

  function getExportRect(mode){
    if(mode === "selection" && state.selectionRect && state.selectionRect.w > 1 && state.selectionRect.h > 1) return state.selectionRect;
    if(mode === "custom" && state.selectionRect && state.selectionRect.w > 1 && state.selectionRect.h > 1) return state.selectionRect;
    return {x:0,y:0,w:CANVAS_W,h:CANVAS_H};
  }
  function downloadCurrentSave(){
    const r=getExportRect(state.saveMode);
    const exportCanvas=document.createElement("canvas");
    exportCanvas.width=Math.max(1,Math.round(r.w)); exportCanvas.height=Math.max(1,Math.round(r.h));
    const ex=exportCanvas.getContext("2d");
    ex.drawImage(canvasBase,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
    ex.drawImage(canvasLine,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
    ex.drawImage(canvasShapes,r.x,r.y,r.w,r.h,0,0,r.w,r.h);
    const url=exportCanvas.toDataURL("image/png");
    const stamp=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    const a=document.createElement("a"); a.href=url; a.download="snapink-"+stamp+"-"+Math.round(r.w)+"x"+Math.round(r.h)+".png"; document.body.appendChild(a); a.click(); a.remove();
    savePanel.hidden=true; deselect();
  }
  saveBtn.addEventListener("click", function(){
    sizePanel.hidden=true;
    shapePanel.hidden=true;
    savePanel.hidden=!savePanel.hidden;
    savePanel.querySelectorAll(".save-option").forEach(function(b){ b.classList.toggle("active", b.dataset.saveMode===state.saveMode); });
  });
  savePanelClose.addEventListener("click", function(){ savePanel.hidden=true; });
  savePanel.querySelectorAll(".save-option").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.saveMode=btn.dataset.saveMode;
      savePanel.querySelectorAll(".save-option").forEach(function(b){ b.classList.toggle("active", b===btn); });
      if(state.saveMode === "custom"){ savePanel.hidden=true; selectTool("select"); statusBarEl.textContent="保存範囲をドラッグで指定してください"; }
    });
  });
  saveDownloadBtn.addEventListener("click", downloadCurrentSave);

  /* =========================================================
     AI補正設定（ツールオプションバーの簡易トグルと同期）
  ========================================================= */
  function setSmoothingEnabled(enabled){
    state.smoothing.enabled = enabled;
    smoothToggle.checked = enabled;
    smoothToggleQuick.checked = enabled;
    strengthBlock.classList.toggle("is-hidden", !enabled);
  }

  smoothToggle.addEventListener("change", function(e){ setSmoothingEnabled(e.target.checked); });
  smoothToggleQuick.addEventListener("change", function(e){ setSmoothingEnabled(e.target.checked); });

  strengthInput.addEventListener("input", function(e){
    state.smoothing.strength = Number(e.target.value);
    strengthValueLabel.textContent = String(state.smoothing.strength);
  });

  /* =========================================================
     キーボードショートカット
  ========================================================= */
  window.addEventListener("keydown", function(e){
    const tag = (e.target && e.target.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    const key = e.key.toLowerCase();

    if ((e.ctrlKey || e.metaKey) && key === "z" && !e.shiftKey){
      e.preventDefault(); undo(); return;
    }
    if ((e.ctrlKey || e.metaKey) && (key === "y" || (key === "z" && e.shiftKey))){
      e.preventDefault(); redo(); return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === "Delete" || e.key === "Backspace"){
      if (state.selectionRect){ e.preventDefault(); eraseSelectionArea(); }
      return;
    }
    if (e.key === "Escape"){
      if (state.selectionRect) deselect();
      return;
    }
    const toolMap = { p:"pen", e:"eraser", i:"eyedropper", g:"fill", s:"shape", r:"select" };
    if (toolMap[key]) selectTool(toolMap[key]);
  });

  /* =========================================================
     起動 / ズーム（CSSサイズのみを変更。transformを使わないので低ズームでも座標が正確）
  ========================================================= */
  let applyZoom = function(){};
  let userZoomed = false;
  const zoomInput=document.getElementById('zoomInput');
  const zoomValue=document.getElementById('zoomValue');
  const stageWrap=document.getElementById('stageWrap');
  function applyZoomNow(){
    const z=clamp(Number(zoomInput.value)/100,0.15,2);
    const displayW=CANVAS_W*z, displayH=CANVAS_H*z;
    stageWrap.style.width=displayW+'px'; stageWrap.style.height=displayH+'px';
    stageEl.style.width=displayW+'px'; stageEl.style.height=displayH+'px';
    stageEl.style.transform='none';
    zoomValue.textContent=Math.round(z*100)+'%';
    applyZoom=applyZoomNow;
    document.querySelectorAll('.inline-text-editor').forEach(function(editor){ editor.remove(); });
  }
  function fitCanvasToView(){
    const rect=canvasArea.getBoundingClientRect();
    const pad=18;
    const maxW=Math.max(80,rect.width-pad*2), maxH=Math.max(80,rect.height-pad*2);
    const z=Math.min(maxW/CANVAS_W,maxH/CANVAS_H,1);
    zoomInput.value=String(Math.max(15,Math.round(z*100)));
    applyZoomNow();
  }
  zoomInput.min='15';
  zoomInput.addEventListener('input',function(){ userZoomed=true; applyZoomNow(); });
  window.addEventListener('resize',function(){ if(!userZoomed) fitCanvasToView(); });
  if(window.visualViewport) window.visualViewport.addEventListener('resize',function(){ if(!userZoomed) fitCanvasToView(); });

  init();
  themeToggle.textContent = document.body.classList.contains("dark") ? "☀" : "☾";
  requestAnimationFrame(function(){ fitCanvasToView(); });


})();
</script>


</body></html>
